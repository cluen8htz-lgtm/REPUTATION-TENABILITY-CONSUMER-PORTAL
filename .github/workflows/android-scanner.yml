name: Android scanner
on:
  push:
    branches: [main]
    paths: ["apps/android-scanner/**", ".github/workflows/android-scanner.yml"]
  pull_request:
    paths: ["apps/android-scanner/**", ".github/workflows/android-scanner.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest ships the Android SDK (ANDROID_HOME is preset); AGP installs any missing platform itself.
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rt-scanner-debug-apk
          path: apps/android-scanner/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
